[package]
name = "oss-net"
description = "Sans-IO SubSpace/Continuum transport: reliable delivery, clustering, file transfers, VIE and OpenSec encryption"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oss-net"
readme = "README.md"
keywords = ["subspace", "continuum", "gamedev", "netcode", "sans-io"]
categories = ["game-development", "network-programming", "cryptography"]

[features]
default = ["opensec", "os-entropy"]
## OpenSec encryption (X25519 + ChaCha20-Poly1305).
opensec = ["dep:x25519-dalek", "dep:chacha20poly1305", "dep:hkdf", "dep:sha2"]
## OpenSec records with ring's assembly ChaCha20-Poly1305: two to three times
## faster per record than the default pure-Rust one, but compiles C and
## assembly (not for wasm). For servers; see docs/performance.md.
opensec-ring = ["opensec", "dep:ring"]
## `opensec::os_entropy`, randomness from the operating system (in browsers,
## `crypto.getRandomValues` on wasm32-unknown-unknown).
os-entropy = ["dep:getrandom"]

[dependencies]
chacha20poly1305 = { version = "0.11.0", default-features = false, optional = true }
getrandom = { version = "0.4.3", optional = true }
hkdf = { version = "0.13.0", optional = true }
ring = { version = "0.17.14", default-features = false, optional = true }
sha2 = { version = "0.11.1", optional = true }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"], optional = true }

# Browsers: wasm32-unknown-unknown has no OS, so take randomness from the Web
# Crypto API.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4.3", optional = true, features = ["wasm_js"] }

[lints]
workspace = true

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }


[[bench]]
name = "transport"
harness = false

# The soak harness compares VIE with OpenSec, so it needs the feature.
[[example]]
name = "soak"
required-features = ["opensec"]


[package.metadata.docs.rs]
all-features = true

# Runs the relay end to end with OpenSec and VIE.
[[test]]
name = "relay_e2e"
required-features = ["opensec", "os-entropy"]

# A real WebSocket for the relay end-to-end test and the relay_echo example.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tungstenite = "0.30"

# The browser example (examples/browser.rs).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.107", features = ["BinaryType", "Document", "Element", "Location", "MessageEvent", "WebSocket", "Window", "console"] }

[[example]]
name = "relay_echo"
required-features = ["opensec", "os-entropy"]

[[example]]
name = "browser"
crate-type = ["cdylib"]
required-features = ["opensec", "os-entropy"]
