[package]
name = "oss-net"
description = "Sans-IO SubSpace transport: reliable layer, clustering, file transfer, ciphers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["opensec", "os-entropy"]
## OpenSec encryption (X25519 + ChaCha20-Poly1305).
opensec = ["dep:x25519-dalek", "dep:chacha20poly1305", "dep:hkdf", "dep:sha2"]
## `opensec::os_entropy`, randomness from the operating system. On
## wasm32-unknown-unknown the final binary must configure getrandom's backend.
os-entropy = ["dep:getrandom"]

[dependencies]
chacha20poly1305 = { version = "0.11.0", default-features = false, optional = true }
getrandom = { version = "0.4.3", optional = true }
hkdf = { version = "0.13.0", optional = true }
sha2 = { version = "0.11.1", optional = true }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"], optional = true }

[lints]
workspace = true

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }

[[bench]]
name = "transport"
harness = false

