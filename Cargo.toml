[workspace]
resolver = "3"
members = ["crates/*"]
# cargo-fuzz targets; built separately (see fuzz/README.md).
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0-dev9"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/DangerMouseUK/oss-core"

[workspace.dependencies]
oss-proto = { path = "crates/oss-proto", version = "0.1.0-dev9" }
oss-net = { path = "crates/oss-net", version = "0.1.0-dev9" }
oss-formats = { path = "crates/oss-formats", version = "0.1.0-dev9" }
oss-bot-sdk = { path = "crates/oss-bot-sdk", version = "0.1.0-dev9" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
# No symbol table in a release program. Rust's default release build drops the
# debug information but keeps the symbol table, so a Linux or macOS program
# would still carry the name of every function in it. "symbols" removes those
# names, on every platform. It changes no behaviour: panic messages, with their
# file and line, and log lines are as before. A backtrace (RUST_BACKTRACE=1)
# shows addresses instead of function names.
strip = "symbols"
