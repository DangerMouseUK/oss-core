name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  features-and-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p oss-net --no-default-features --all-targets -- -D warnings
      - run: cargo clippy -p oss-net --no-default-features --features opensec --all-targets -- -D warnings
      # The optional ring backend for OpenSec records (servers).
      - run: cargo clippy -p oss-net --features opensec-ring --all-targets -- -D warnings
      - run: cargo test -p oss-net --features opensec-ring
      # Browser builds: every crate with default features, and oss-net bare.
      - run: cargo build --target wasm32-unknown-unknown -p oss-proto -p oss-formats -p oss-net
      - run: cargo build --target wasm32-unknown-unknown -p oss-net --no-default-features
      # The browser example: oss-net in wasm, connecting through the WebSocket relay.
      - run: cargo build --target wasm32-unknown-unknown -p oss-net --example browser
      - run: cargo clippy --target wasm32-unknown-unknown -p oss-proto -p oss-formats -p oss-net -- -D warnings

  # The fuzz crate is outside the workspace; only check that its targets still
  # compile (running them needs nightly and cargo-fuzz; see fuzz/README.md).
  fuzz-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo check --manifest-path fuzz/Cargo.toml --bins

  # The transport budget: 500 players must fit in 20% of a core, with no
  # reliable packet lost. See docs/performance.md.
  #
  # Two runs, because the fan-out decides the volume and the default is not
  # the realistic one. --fanout 30 is the long-standing smoke test (about 3%
  # on a desktop CPU); --fanout 82 is what ASSS's relay rules actually produce
  # for 500 players spread over a whole map (5.3%), measured, not assumed.
  # A crowded arena reaches --fanout 350, which costs about 20% of a core --
  # the whole budget, for the transport alone -- and so does not fit once game
  # logic is added; it is deliberately not gated here rather than gated at a
  # threshold it would fail. docs/performance.md says so.
  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p oss-net --example soak -- --peers 500 --seconds 30 --max-cpu 20
      - run: cargo run --release -p oss-net --example soak -- --peers 500 --seconds 30 --fanout 82 --max-cpu 12

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --workspace

  # docs.rs builds every crate with all features; broken or ambiguous
  # intra-doc links fail here rather than render wrongly there.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
