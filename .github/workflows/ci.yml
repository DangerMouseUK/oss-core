name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The toolchain the gating jobs run on -- test (fmt + clippy), the feature and
  # wasm clippy sweep, package and docs.
  #
  # Those jobs deny warnings: `cargo clippy ... -- -D warnings` and
  # `RUSTDOCFLAGS: -D warnings`. On a floating channel that means the day a new
  # stable ships a new lint they go red on code nobody has touched -- which is
  # what happened on 2026-11-13, when 1.100.0 turned oss-server's main red for
  # two `needless_range_loop` findings 1.99 does not emit.
  #
  # The fuzz-targets and soak jobs are deliberately NOT pinned to this: they do
  # not deny warnings, so a new lint cannot redden them, and leaving them on
  # floating `stable` is how a genuinely broken release still gets caught here.
  # The msrv job pins separately, to the MSRV itself.
  #
  # Note the `uses:` ref stays @stable -- the ref pins the *action*, and the
  # `toolchain:` input below overrides the toolchain that branch would
  # otherwise default to. Changing the ref would not pin anything.
  #
  # To bump this value. It is a procedure, not a guess:
  #
  #   1. Look at the newest run of the "Rust drift" workflow
  #      (.github/workflows/rust-drift.yml). It runs these same
  #      warning-denying gates on floating `stable` every week, and its job
  #      summary names the stable it resolved and whether each gate passed
  #      on it. If there is no recent run, start one by hand:
  #      Actions -> Rust drift -> Run workflow.
  #   2. Bump only when that summary says every gate passed. If one failed,
  #      that failure is the work: fix it first, as its own change. Bumping
  #      on top of a failing gate only moves a red run out of a schedule and
  #      into a pull request, which is the thing the pin exists to stop.
  #   3. Raise this one value to the version the summary names, in a pull
  #      request that changes nothing else -- so CI proves it green on its
  #      own, and so it can be reverted on its own.
  #   4. oss-core, oss-server and oss-client each carry this value. Bump all
  #      three, and land oss-core first: the other two check it out as a
  #      sibling, so they are where a bad oss-core shows up.
  #
  # No bot does this. rust-drift.yml says why not, at some length.
  RUST_PINNED: "1.100.0"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_PINNED }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  features-and-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_PINNED }}
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p oss-net --no-default-features --all-targets -- -D warnings
      - run: cargo clippy -p oss-net --no-default-features --features opensec --all-targets -- -D warnings
      # The optional ring backend for OpenSec records (servers).
      - run: cargo clippy -p oss-net --features opensec-ring --all-targets -- -D warnings
      - run: cargo test -p oss-net --features opensec-ring
      # Browser builds: every crate with default features, and oss-net bare.
      - run: cargo build --target wasm32-unknown-unknown -p oss-proto -p oss-formats -p oss-net
      - run: cargo build --target wasm32-unknown-unknown -p oss-net --no-default-features
      # The browser example: oss-net in wasm, connecting through the WebSocket relay.
      - run: cargo build --target wasm32-unknown-unknown -p oss-net --example browser
      - run: cargo clippy --target wasm32-unknown-unknown -p oss-proto -p oss-formats -p oss-net -- -D warnings

  # The fuzz crate is outside the workspace; only check that its targets still
  # compile (running them needs nightly and cargo-fuzz; see fuzz/README.md).
  fuzz-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo check --manifest-path fuzz/Cargo.toml --bins

  # The transport budget: 500 players must fit in 20% of a core, with no
  # reliable packet lost. See docs/performance.md.
  #
  # Two runs, because the fan-out decides the volume and the default is not
  # the realistic one. --fanout 30 is the long-standing smoke test (about 3%
  # on a desktop CPU); --fanout 82 is what ASSS's relay rules actually produce
  # for 500 players spread over a whole map (5.3%), measured, not assumed.
  # A crowded arena reaches --fanout 350, which costs about 20% of a core --
  # the whole budget, for the transport alone -- and so does not fit once game
  # logic is added; it is deliberately not gated here rather than gated at a
  # threshold it would fail. docs/performance.md says so.
  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p oss-net --example soak -- --peers 500 --seconds 30 --max-cpu 20
      - run: cargo run --release -p oss-net --example soak -- --peers 500 --seconds 30 --fanout 82 --max-cpu 12

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_PINNED }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --workspace

  # docs.rs builds every crate with all features; broken or ambiguous
  # intra-doc links fail here rather than render wrongly there.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_PINNED }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
